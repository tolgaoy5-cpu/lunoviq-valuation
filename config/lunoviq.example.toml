# Committed defaults. Copy to config/lunoviq.toml (git-ignored) and edit locally.

[sec]
# SEC EDGAR fair-access policy requires a descriptive User-Agent with a contact.
user_agent = "Lunoviq Research contact@example.com"

[http]
cache_dir = ".cache"
# Seconds a cached response stays fresh. Filings change rarely; prices often.
ttl_fundamentals = 86400
ttl_prices = 900
ttl_rates = 43200

[providers]
# Each role is served by a pluggable provider (see lunoviq/providers/).
fundamentals = "sec_edgar"
prices = "yahoo"
risk_free = ["treasury", "fred"]      # tried in order
equity_risk_premium = "damodaran"

[damodaran]
# Column of Damodaran's monthly implied ERP series to use.
erp_column = "ERP (T12m with sustainable payout)"

[wacc]
# Industry-standard defaults (change only with a reason):
#   beta: 5y monthly regression vs S&P 500, Blume-adjusted (as Bloomberg "adjusted beta")
#   cost of debt: risk-free + default spread of the synthetic rating implied by
#                 interest coverage (Damodaran, large non-financial firms table)
beta_months = 60                      # monthly returns vs market index
market_index = "^GSPC"                # S&P 500
beta_bounds = [0.3, 2.5]              # outside -> flagged
beta_adjustment = "blume"             # "blume" = 0.67*raw + 0.33 ; "none" = raw regression beta
credit_spread = 0.01                  # fallback only, if the ratings table cannot be fetched
tax_rate_fallback = 0.21              # US federal statutory, used if effective rate unusable
tax_rate_bounds = [0.0, 0.35]

[paths]
template = "templates/Lunoviq_Master_Financial_Model_v7.xlsx"
output_dir = "output"
overrides_dir = "overrides"
peers_dir = "peers"                   # peers/<TICKER>.csv: analyst peer list (ticker,decision,rationale)

[pipeline]
recalculate = true                    # needs Microsoft Excel (xlwings)
years = 3                             # historical columns in the template
history_years = 5                     # history used for growth, capex, payout and scenario ranges
# Left at the template value and flagged in 09_Sources (standard 2.5% long-run growth).
review_inputs = ["val_TerminalGrowth"]

[drivers]
# Mechanical defaults derived from each company's history (see lunoviq/drivers.py).
growth_bounds = [-0.20, 0.40]         # recent CAGR is capped before fading to terminal growth
consensus_match = 0.02                # consensus used only if its last actual revenue is within 2% of SEC
growth_gap_review = 0.10              # flag year-1 growth this far from history (half of it vs consensus)
asset_life_bounds = [5, 40]           # years; net PP&E / D&A
